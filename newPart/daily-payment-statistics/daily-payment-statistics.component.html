<div class="container">
  <h1>📈 Daily Payment Statistics</h1>

  <div class="table-responsive">
    <table class="table table-bordered table-sm table-hover align-middle">
      <thead class="table-header">
        <tr>
          <th>📅 Date</th>
          <th>💳 Number of Payments</th>
          <th>💵 Total Amount</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let stat of statistics">
          <td>{{ stat.date | date:'shortDate' }}</td>
          <td>{{ stat.numberOfPayments }}</td>
          <td class="currency">{{ stat.totalAmount | currency:'USD' }}</td>
          <td>
            <button class="btn btn-warning btn-sm" (click)="archivePayment(stat)">🗂️ Archive</button>
            <button class="btn btn-danger btn-sm" (click)="deletePayment(stat.id)">❌ Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="chart-container">
    <h6 class="m-0 font-weight-bold text-primary">Total Payment Trend for the Last 2 Days</h6>
    <apx-chart *ngIf="!isChartLoading && chartOptions.series.length > 0"
      [series]="chartOptions.series"
      [chart]="chartOptions.chart"
      [labels]="chartOptions.labels"
      [responsive]="chartOptions.responsive">
    </apx-chart>
  </div>
</div>
